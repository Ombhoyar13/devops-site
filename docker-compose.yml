services:
  web:
    build: .
    image: devops-site:local
    ports:
      - "8080:3000"
    environment:
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-1.0.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
